const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function getWeekDates(weekOffset = 0) {
  const today = new Date();
  const dow = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((dow + 6) % 7) + weekOffset * 7);
  return DAYS.map((_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
}

function generateId() { return Math.random().toString(36).slice(2,9); }

function parseFraction(val) {
  if (!val && val !== 0) return 0;
  const str = String(val).trim();
  const fractions = { "¼":0.25, "½":0.5, "¾":0.75, "⅓":0.333, "⅔":0.667, "⅛":0.125, "⅜":0.375, "⅝":0.625, "⅞":0.875 };
  if (fractions[str] !== undefined) return fractions[str];
  // Handle mixed like "1½" or "1 ½"
  for (const [f, v] of Object.entries(fractions)) {
    if (str.includes(f)) {
      const whole = parseFloat(str.replace(f, "").trim()) || 0;
      return whole + v;
    }
  }
  return parseFloat(str) || 0;
}

function loadState(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function saveState(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

function guessDefaults(name) {
  const n = name.toLowerCase().trim();
  return INGREDIENT_DEFAULTS[n] || null;
}

function guessCategory(name) {
  const n = name.toLowerCase();
  if (/chicken|beef|pork|ham|turkey|salmon|shrimp|bacon|sausage|tuna|lamb/.test(n)) return "Meat & Seafood";
  if (/milk|cheese|butter|egg|cream|yogurt|mozzarella|cheddar|parmesan/.test(n)) return "Dairy & Eggs";
  if (/bread|bun|roll|bagel|tortilla|wrap|pita/.test(n)) return "Bread & Bakery";
  if (/apple|banana|orange|lettuce|spinach|tomato|onion|garlic|pepper|carrot|broccoli|cucumber|lemon|lime|avocado|mushroom|potato|zucchini|celery|kale/.test(n)) return "Produce";
  if (/frozen|ice cream/.test(n)) return "Frozen";
  if (/juice|water|soda|coffee|tea|wine|beer/.test(n)) return "Beverage";
  if (/oil|salt|pepper|sugar|flour|rice|pasta|sauce|vinegar|spice|cumin|paprika|oregano|basil|cinnamon|honey|syrup|stock|broth|can|jar/.test(n)) return "Pantry & Dry Goods";
  return "Other";
}

async function callClaude(prompt, systemPrompt, maxTokens = 1000) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: maxTokens,
      system: systemPrompt || "You are a helpful meal prep assistant.",
      messages: [{ role: "user", content: prompt }]
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(`API error ${res.status}: ${err?.error?.message || res.statusText}`);
  }
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.content?.map(b => b.text || "").join("") || "";
}

function PropagateModal({ meal, currentDay, allDays, onPropagate, onClose }) {
  const otherDays = (allDays || DAYS).filter(d => d !== currentDay);
  const [selected, setSelected] = useState(new Set());

  function toggle(day) {
    setSelected(prev => {
      const next = new Set(prev);
      next.has(day) ? next.delete(day) : next.add(day);
      return next;
    });
  }

  return (
    <div style={styles.modalOverlay}>
      <div style={styles.modal}>
        <h3 style={{ margin:"0 0 6px", fontSize:17, fontWeight:700 }}>
          Duplicate "{meal.name || "this meal"}"
        </h3>
        <p style={{ color:"#888", fontSize:13, margin:"0 0 16px" }}>
          Choose which days to copy this meal to:
        </p>

        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
          <span style={styles.label}>Days</span>
          <button
            onClick={() => setSelected(selected.size === otherDays.length ? new Set() : new Set(otherDays))}
            style={styles.smallBtn}>
            {selected.size === otherDays.length ? "Deselect All" : "Select All"}
          </button>
        </div>

        <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:20 }}>
          {otherDays.map(day => {
            const isIso = /^\d{4}-\d{2}-\d{2}$/.test(day);
            const label = isIso
              ? new Date(day + 'T00:00:00').toLocaleDateString("en-US", { weekday:"short", month:"numeric", day:"numeric" })
              : day;
            return (
              <button key={day} onClick={() => toggle(day)}
                style={{ ...styles.dayPill, ...(selected.has(day) ? styles.dayPillActive : {}) }}>
                {label}
              </button>
            );
          })}
        </div>

        <div style={{ display:"flex", gap:10 }}>
          <button onClick={onClose} style={styles.outlineBtn}>Cancel</button>
          <button
            disabled={selected.size === 0}
            onClick={() => { onPropagate([...selected]); onClose(); }}
            style={{ ...styles.primaryBtn, flex:1, opacity: selected.size===0 ? 0.5 : 1 }}>
            Copy to {selected.size} day{selected.size !== 1 ? "s" : ""}
          </button>
        </div>
      </div>
    </div>
  );
}

function SuggestInput({ value, onChange, suggestions, placeholder, width, style: extraStyle }) {
  const [focused, setFocused] = useState(false);
  const wrapRef = useRef(null);

  const filtered = value.trim() === ""
    ? suggestions.slice(0, 10)
    : suggestions.filter(s => s.toLowerCase().startsWith(value.toLowerCase()) && s !== value).slice(0, 8);

  const showDropdown = focused && filtered.length > 0;

  useEffect(() => {
    function handleClick(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setFocused(false);
    }
    document.addEventListener("mousedown", handleClick);
    return () => document.removeEventListener("mousedown", handleClick);
  }, []);

  return (
    <div ref={wrapRef} style={{ position:"relative", width }}>
      <input
        placeholder={placeholder}
        value={value}
        onChange={e => onChange(e.target.value)}
        onFocus={() => setFocused(true)}
        style={{ ...styles.inputSm, width:"100%", boxSizing:"border-box", ...extraStyle }}
      />
      {showDropdown && (
        <div style={{ ...styles.suggestionDropdown, minWidth:90 }}>
          {filtered.map(s => (
            <div key={s} style={styles.suggestionItem}
              onMouseEnter={e => e.currentTarget.style.background="#f5f3ff"}
              onMouseLeave={e => e.currentTarget.style.background="transparent"}
              onMouseDown={e => { e.preventDefault(); onChange(s); setFocused(false); }}>
              {s}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function getIngredientEmoji(name) {
  const n = name.toLowerCase().trim();
  if (INGREDIENT_EMOJIS[n]) return INGREDIENT_EMOJIS[n];
  // Partial match
  for (const [key, emoji] of Object.entries(INGREDIENT_EMOJIS)) {
    if (n.includes(key) || key.includes(n)) return emoji;
  }
  return "";
}

function IngredientNameInput({ value, onChange, onSelect }) {
  const [focused, setFocused] = useState(false);
  const [aiLoading, setAiLoading] = useState(false);
  const wrapRef = useRef(null);

  const filtered = value.trim().length === 0 ? [] :
    COMMON_INGREDIENTS.filter(s => s.toLowerCase().includes(value.toLowerCase()) && s.toLowerCase() !== value.toLowerCase()).slice(0, 7);

  const showDropdown = focused && filtered.length > 0;

  useEffect(() => {
    function handleClick(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setFocused(false);
    }
    document.addEventListener("mousedown", handleClick);
    return () => document.removeEventListener("mousedown", handleClick);
  }, []);

  async function selectIngredient(name) {
    setFocused(false);
    setAiLoading(true);
    try {
      const raw = await callClaude(
        `For the ingredient "${name}", suggest a typical home cooking quantity. Return ONLY a JSON object: {"qty":"2","unit":"tbsp","category":"Pantry & Dry Goods"}. Categories: Produce, Meat & Seafood, Dairy & Eggs, Bread & Bakery, Pantry & Dry Goods, Frozen, Beverages, Other. No markdown.`,
        "You are a cooking assistant. Return only valid JSON."
      );
      const parsed = JSON.parse(raw.replace(/```json|```/g,"").trim());
      onSelect({ name, qty: String(parsed.qty || ""), unit: String(parsed.unit || ""), category: parsed.category || guessCategory(name), emoji: getIngredientEmoji(name) });
    } catch {
      onSelect({ name, qty: "", unit: "", category: guessCategory(name) });
    }
    setAiLoading(false);
  }

  async function handleKeyDown(e) {
    if ((e.key === "Enter" || e.key === "Tab") && value.trim().length >= 2) {
      e.preventDefault();
      await selectIngredient(value.trim());
    }
  }

  return (
    <div ref={wrapRef} style={{ flex:1, position:"relative" }}>
      <input
        placeholder="Ingredient"
        value={aiLoading ? "✦ Looking up…" : value}
        disabled={aiLoading}
        onChange={e => onChange(e.target.value)}
        onFocus={() => setFocused(true)}
        onKeyDown={handleKeyDown}
        style={{
          ...styles.inputSm, width:"100%", boxSizing:"border-box",
          textDecoration: "none", color: aiLoading ? "#aaa" : "#1a1a1a"
        }}
      />
      {showDropdown && (
        <div style={{ ...styles.suggestionDropdown, zIndex:300 }}>
          {filtered.map(s => {
            const idx = s.toLowerCase().indexOf(value.toLowerCase());
            return (
              <div key={s} style={styles.suggestionItem}

// ── Nutrition Panel ───────────────────────────────────────────────────────────
const NUTRIENTS = [
  { key:"calories", label:"Calories", unit:"kcal", color:"#e07a2a", dv:2000 },
  { key:"protein",  label:"Protein",  unit:"g",    color:"#2a7a2a", dv:50   },
  { key:"carbs",    label:"Carbs",    unit:"g",    color:"#2a6aba", dv:275  },
  { key:"sugar",    label:"Sugar",    unit:"g",    color:"#ba2a6a", dv:50   },
  { key:"fat",      label:"Fat",      unit:"g",    color:"#8a6a2a", dv:78   },
  { key:"fiber",    label:"Fiber",    unit:"g",    color:"#2a8a6a", dv:28   },
  { key:"sodium",   label:"Sodium",   unit:"mg",   color:"#6a2a8a", dv:2300 },
];

function NutritionPanel({ meal }) {
  const [nutrition, setNutrition] = useState(meal.nutrition || null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  async function analyze() {
    const ings = meal.ingredients.filter(i => i.name.trim());
    if (ings.length === 0) { setError("Add ingredients first."); return; }
    setLoading(true); setError("");
    try {
      const ingList = ings.map(i => `${i.qty || 1} ${i.unit} ${i.name}`).join(", ");
      const scale = parseFloat(meal.servings)||1;
      const raw = await callClaude(
        `Calculate total nutrition for this meal (${scale} total serving${scale!==1?"s":""}) with these ingredients: ${ingList}.
Return ONLY a JSON object with these exact keys: calories, protein, carbs, sugar, fat, fiber, sodium.
All values as numbers. calories in kcal, sodium in mg, everything else in grams. No markdown.`,
        "You are a nutrition expert. Return only a valid JSON object with numeric values."
      );
      const parsed = JSON.parse(raw.replace(/```json|```/g,"").trim());
      setNutrition(parsed);
    } catch { setError("Analysis failed. Try again."); }
    setLoading(false);
  }

  return (
    <div style={styles.nutritionBox}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom: nutrition ? 12 : 0 }}>
        <span style={styles.label}>Nutrition Summary</span>
        <button onClick={analyze} disabled={loading}
          style={{ ...styles.smallBtn, background:"#fff4e8", color:"#e07a2a", borderColor:"#f0c898" }}>
          {loading ? "⏳ Analyzing…" : nutrition ? "↺ Recalculate" : "✦ Analyze Nutrition"}
        </button>
        {error && <span style={{ fontSize:12, color:"#e55", marginLeft:8 }}>{error}</span>}
      </div>

      {nutrition && (
        <>
          <div style={{ display:"flex", flexDirection:"column", gap:8, marginTop:10 }}>
            {NUTRIENTS.map(n => {
              const val = typeof nutrition[n.key] === "number" ? Math.round(nutrition[n.key]) : null;
              const pct = val !== null ? Math.min(Math.round((val / n.dv) * 100), 999) : null;
              const barWidth = val !== null ? Math.min((val / n.dv) * 100, 100) : 0;
              const barColor = barWidth > 90 ? "#e11d48" : barWidth > 65 ? "#f59e0b" : n.color;
              return (
                <div key={n.key} style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, padding:"9px 12px", boxShadow:C.shadow }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:5 }}>
                    <span style={{ fontSize:12, fontWeight:600, color:C.inkMid }}>{n.label}</span>
                    <span style={{ fontSize:13, fontWeight:700, color:n.color }}>{val ?? "—"} <span style={{ fontSize:11, fontWeight:400, color:"#aaa" }}>{n.unit}</span></span>
                  </div>
                  {/* Progress bar */}
                  <div style={{ position:"relative", height:18, background:"#f3f4f6", borderRadius:20, overflow:"hidden" }}>
                    <div style={{
                      position:"absolute", left:0, top:0, height:"100%",
                      width:`${barWidth}%`,
                      background:`linear-gradient(90deg, ${barColor}99, ${barColor})`,
                      borderRadius:20,
                      transition:"width .6s ease",
                      boxShadow:`0 0 8px ${barColor}55`
                    }} />
                    {pct !== null && (
                      <span style={{
                        position:"absolute", right:8, top:"50%", transform:"translateY(-50%)",
                        fontSize:10, fontWeight:700,
                        color: barWidth > 40 ? "#fff" : C.inkMid,
                        mixBlendMode: barWidth > 40 ? "normal" : "normal",
                        zIndex:1, letterSpacing:".02em"
                      }}>
                        {pct}% DV
                      </span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
          <p style={{ fontSize:11, color:"#bbb", margin:"8px 0 0" }}>
            Based on 2,000 kcal/day daily values. Estimates for {parseFloat(meal.servings)||1} serving{(parseFloat(meal.servings)||1)!==1?"s":""}. Approximate.
          </p>
        </>
      )}
    </div>
  );
}

// ── Meal Chat ─────────────────────────────────────────────────────────────────
function MealChat({ meal, onUpdateIngredients }) {
  const [messages, setMessages] = useState([
    { role:"assistant", text:"Hi! Tell me how you'd like to customize your meal" }
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior:"smooth" });
  }, [messages]);

  async function send() {
    const text = input.trim();
    if (!text || loading) return;
    setInput("");

    const userMsg = { role:"user", text };
    const newMessages = [...messages, userMsg];
    setMessages(newMessages);
    setLoading(true);

    const ingredientList = meal.ingredients.filter(i => i.name.trim())
      .map(i => `${i.qty} ${i.unit} ${i.name}`).join(", ");

    const history = newMessages.map(m => ({
      role: m.role === "assistant" ? "assistant" : "user",
      content: m.text
    }));

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: `You are a helpful meal prep assistant. The user is editing a meal called "${meal.name || "this meal"}" (${parseFloat(meal.servings)||1} total servings).
Current ingredients: ${ingredientList || "none yet"}.

When the user asks to modify ingredients (add, remove, swap, adjust quantities, or convert units), you MUST:
1. Reply conversationally in 1-2 sentences explaining what you changed.
2. Then output a JSON block on its own line in this exact format:
INGREDIENTS_UPDATE: [{"name":"egg","qty":"4","unit":"large","category":"Dairy & Eggs","inPantry":false},...]

Unit conversion examples: "convert to pounds" → change unit to "lb" and convert qty accurately. "use cups instead of ml" → convert ml to cups. Always do the math correctly when converting units.
Categories must be one of: Produce, Meat & Seafood, Dairy & Eggs, Bread & Bakery, Pantry & Dry Goods, Frozen, Beverages, Other.
If the user is just asking a question (not requesting changes), answer conversationally with NO JSON block.`,
          messages: history
        })
      });
      const data = await res.json();
      const raw = data.content?.map(b => b.text || "").join("") || "";

      // Parse out ingredient update if present
      const updateMatch = raw.match(/INGREDIENTS_UPDATE:\s*(\[[\s\S]*?\])/);
      let displayText = raw.replace(/INGREDIENTS_UPDATE:\s*\[[\s\S]*?\]/, "").trim();

      if (updateMatch) {
        try {
          const parsed = JSON.parse(updateMatch[1]);
          const newIngs = parsed.map(i => ({ ...i, id: generateId(), qty: String(i.qty||"") }));
          onUpdateIngredients(newIngs);
          if (!displayText) displayText = "Done! I've updated your ingredients.";
        } catch {
          displayText = displayText || "Updated your ingredients!";
        }
      }

      setMessages(prev => [...prev, { role:"assistant", text: displayText }]);
    } catch {
      setMessages(prev => [...prev, { role:"assistant", text:"Sorry, something went wrong. Try again." }]);
    }
    setLoading(false);
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  }

  return (
    <div style={styles.chatBox}>
      <span style={{ ...styles.label, display:"block", marginBottom:8 }}>✦ Meal Assistant</span>
      <div style={styles.chatMessages}>
        {messages.map((m, i) => (
          <div key={i} style={{
            ...styles.chatBubble,
            ...(m.role === "user" ? styles.chatBubbleUser : styles.chatBubbleAi)
          }}>
            {m.text}
          </div>
        ))}
        {loading && (
          <div style={{ ...styles.chatBubble, ...styles.chatBubbleAi, color:"#aaa", fontStyle:"italic" }}>
            Thinking…
          </div>
        )}
        <div ref={bottomRef} />
      </div>
      <div style={{ display:"flex", gap:8, marginTop:8 }}>
        <input
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={handleKey}
          placeholder="e.g. add more protein, remove the milk…"
          style={{ ...styles.inputSm, flex:1 }}
          disabled={loading}
        />
        <button onClick={send} disabled={loading || !input.trim()} style={styles.primaryBtn}>
          Send
        </button>
      </div>
    </div>
  );
}

// ── Meal Card ─────────────────────────────────────────────────────────────────
function MealCard({ meal, currentDay, allDays, onUpdate, onDelete, onPropagate, onAddToPantry, updateMealDirect }) {
  const [expanded, setExpanded] = useState(false);
  const [aiLoading, setAiLoading] = useState(false);
  const aiLoadingRef = useRef(false);
  const [aiError, setAiError] = useState("");
  const [showPropagate, setShowPropagate] = useState(false);
  const [completed, setCompleted] = useState(meal.completed || false);
  useEffect(() => { setCompleted(meal.completed || false); }, [meal.completed]);
  const mealRef = useRef(meal);
  const onUpdateRef = useRef(onUpdate);
  useEffect(() => { mealRef.current = meal; }, [meal]);
  useEffect(() => { onUpdateRef.current = onUpdate; }, [onUpdate]);
  const cardRef = useRef(null);

  function scrollCardIntoView() {
    const start = Date.now();
    let lastHeight = 0;
    function check() {
      if (!cardRef.current) return;
      const rect = cardRef.current.getBoundingClientRect();
      if (rect.height !== lastHeight && Date.now() - start < 800) {
        lastHeight = rect.height;
        requestAnimationFrame(check);
      } else {
        const targetScrollY = window.scrollY + rect.bottom - window.innerHeight + 24;
        if (targetScrollY > window.scrollY) {
          window.scrollTo({ top: targetScrollY, behavior:"smooth" });
        }
      }
    }
    requestAnimationFrame(check);
  }

  function toggleExpanded() {
    const next = !expanded;
    setExpanded(next);
    if (next) scrollCardIntoView();
  }

  function markComplete() {
    setCompleted(true);
    setExpanded(false);
    onUpdate({ ...meal, completed: true });
  }
  function unmarkComplete() {
    setCompleted(false);
    onUpdate({ ...meal, completed: false });
  }

  function addIngredient() {
    onUpdate({ ...meal, ingredients: [...meal.ingredients, { id: generateId(), name:"", qty:"", unit:"", category:"Other", inPantry:false }] });
  }

  function updateIng(id, updated) {
    if (updated.name !== meal.ingredients.find(i => i.id===id)?.name) {
      updated.category = guessCategory(updated.name);
    }
    onUpdate({ ...meal, ingredients: meal.ingredients.map(i => i.id===id ? updated : i) });
  }

  function removeIng(id) {
    onUpdate({ ...meal, ingredients: meal.ingredients.filter(i => i.id!==id) });
  }

  async function suggestIngredients() {
    if (aiLoadingRef.current) return;
    const mealId = meal.id;
    const mealName = meal.name;
    const mealServings = meal.servings;
    if (!mealName.trim()) { setAiError("Enter a meal name first."); setExpanded(true); return; }
    setExpanded(true);
    scrollCardIntoView();
    setAiError("");
    aiLoadingRef.current = true;
    setAiLoading(true);
    const servings = parseFloat(mealServings) || 1;
    try {
      const raw = await callClaude(
        `List ingredients for "${mealName}" scaled for ${servings} total serving${servings !== 1 ? "s" : ""}. Return ONLY a JSON array with quantities already scaled to the TOTAL needed. Example: [{"name":"egg","qty":"4","unit":"large"},{"name":"cheddar cheese","qty":"60","unit":"g"}]. Use practical units (g, ml, tbsp, tsp, cup, piece, slice, clove). No markdown, no explanation.`,
        "You are a recipe assistant. Always return pre-scaled total ingredient quantities as a valid JSON array."
      );
      const items = JSON.parse(raw.replace(/```json|```/g,"").trim());
      const newIngs = items.map(i => ({
        id: generateId(), name: i.name||"", qty: String(i.qty||""), unit: i.unit||"",
        category: guessCategory(i.name||""), emoji: getIngredientEmoji(i.name||""), inPantry: false
      }));
      // Directly update weekPlan in App state by meal id - functional updater gets latest state
      updateMealDirect.current(mealId, upd => ({ ...upd, ingredients: newIngs }));
    } catch (err) {
      setAiError("Failed: " + (err?.message || "please try again."));
    } finally {
      aiLoadingRef.current = false;
      setAiLoading(false);
    }
  }

  const pantryCount = meal.ingredients.filter(i => i.inPantry).length;

  return (
    <>
      {showPropagate && (
        <PropagateModal
          meal={meal}
          currentDay={currentDay}
          allDays={allDays}
          onPropagate={days => onPropagate(meal, days)}
          onClose={() => setShowPropagate(false)}
        />
      )}

      <div ref={cardRef} style={styles.mealCard}>

        {/* Row 1: meal name + pill + done badge */}
        <div
          style={{ display:"flex", alignItems:"center", gap:8, padding:"12px 14px 6px", cursor:"pointer", opacity: completed ? 0.7 : 1, background: expanded ? "transparent" : "#f5f3ff", borderRadius:"14px 14px 0 0", transition:"background .2s" }}
          onClick={toggleExpanded}
          onMouseEnter={e => { if (!expanded) e.currentTarget.style.background="#ede9fe"; }}
          onMouseLeave={e => { if (!expanded) e.currentTarget.style.background="#f5f3ff"; }}
        >
          <MealNameInput value={meal.name} onChange={name => onUpdate({ ...meal, name })} slot={meal.slot} onEnter={suggestIngredients} />
          {completed && (
            <button onClick={e => { e.stopPropagation(); unmarkComplete(); }}
              title="Mark as incomplete"
              style={{ flexShrink:0, background:"#3b82f6", border:"1.5px solid #2563eb", borderRadius:20, padding:"2px 9px", fontSize:11, fontWeight:700, color:"#fff", cursor:"pointer", display:"flex", alignItems:"center", gap:3 }}>
              ✓ Done
            </button>
          )}
        </div>

        {/* Row 2: slot · serves · generate · badge · copy to days */}
        <div style={{ display:"flex", alignItems:"center", gap:7, padding:"4px 14px 12px", overflowX:"auto" }} onClick={e => e.stopPropagation()}>
          <select
            value={meal.slot}
            onChange={e => onUpdate({ ...meal, slot: e.target.value })}
            style={{ ...styles.selectSm, width:96, flexShrink:0 }}
          >
            {["Breakfast","Lunch","Dinner","Dessert","Snack","Beverage"].map(s => <option key={s}>{s}</option>)}
          </select>

          <div style={{ display:"flex", alignItems:"center", gap:4, background:"#f9fafb", border:"1.5px solid #e5e7eb", borderRadius:8, padding:"0 8px", height:33, flexShrink:0 }}>
            <span style={{ fontSize:11, color:"#888", fontWeight:600 }}>Servings</span>
            <input
              type="number" min="1"
              value={meal.servings}
              onChange={e => onUpdate({ ...meal, servings: e.target.value })}
              style={{ width:30, border:"none", background:"transparent", fontSize:13, fontWeight:700, outline:"none", color:"#1c1c1e", textAlign:"center" }}
            />
          </div>

          <button onClick={e => { e.stopPropagation(); suggestIngredients(); }} disabled={aiLoading}
            style={{ ...styles.primaryBtn, padding:"6px 14px", fontSize:12, flexShrink:0, boxShadow:"0 2px 8px rgba(34,134,58,0.25)" }}>
            {aiLoading ? "✦ Building…" : "✦ Generate Ingredients"}
          </button>

          <button onClick={() => setShowPropagate(true)} style={{ ...styles.duplicateBtn, marginLeft:"auto", background:"#f1f5f9", color:"#64748b", border:"1px solid #e2e8f0" }}>

            {meal.generating ? (

        {/* Expanded body */}
        {expanded && (

              <span style={styles.label}>Ingredients</span>
              <span style={{ fontSize:11, color:"#bbb", fontStyle:"italic" }}>🧺 = skip on shopping list</span>

            {meal.ingredients.length === 0 && (
              <div style={{ textAlign:"center", padding:"18px 0 10px" }}>
                {aiLoading ? (
                  <>
                    <div style={{ fontSize:28, marginBottom:8, animation:"spin 1.2s linear infinite", display:"inline-block" }}>✦</div>
                    <p style={{ color:"#7c3aed", fontSize:13, fontWeight:600, margin:0 }}>Generating ingredients…</p>

                    <p style={{ color:"#ccc", fontSize:11, margin:0 }}>Click ✦ Generate Ingredients or add them manually</p>
                  </>
                )}

              <IngredientRow key={ing.id} ing={ing}
                onChange={u => updateIng(ing.id, u)}

            <button onClick={addIngredient} style={{ ...styles.smallBtn, marginTop:8, marginBottom:6 }}>+ Add ingredient</button>
            <button onClick={markComplete}
              style={{ width:"100%", padding:"7px", background:"#3b82f6", border:"1.5px solid #3b82f6", borderRadius:10, cursor:"pointer", fontSize:12, fontWeight:700, color:"#fff", marginBottom:4, textAlign:"center", boxShadow:"0 4px 12px rgba(59,130,246,.3)" }}>
              ✓ Complete
            </button>

            <div style={{ marginTop:16, borderTop:`1px solid ${C.borderLight}`, paddingTop:14 }}>
              <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:8 }}>
                <span style={{ fontSize:15 }}>💬</span>
                <span style={{ fontSize:13, fontWeight:700, color:C.inkMid }}>Ask about this meal</span>
                <span style={{ fontSize:11, color:"#bbb", marginLeft:4 }}>e.g. "make this dairy free" or "suggest a substitution for eggs"</span>
              </div>
              <MealChat meal={meal} onUpdateIngredients={newIngs => onUpdate({ ...meal, ingredients: newIngs })} />
            </div>

            <NutritionPanel meal={meal} />
          </div>
        )}
      </div>
    </>
  );
}

function useRotatingPlaceholder(items) {
  const [index] = React.useState(() => Math.floor(Math.random() * items.length));
  return items[index];
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null, info: null }; }
  static getDerivedStateFromError(e) { return { error: e.message }; }
  componentDidCatch(e, info) { this.setState({ error: e.message, info: info.componentStack }); }
  render() {
    if (this.state.error) return (
      <div style={{ padding:40, fontFamily:"monospace", background:"#fff1f2", minHeight:"100vh" }}>
        <h2 style={{ color:"#e11d48" }}>⚠️ App Error</h2>
        <p style={{ color:"#555", marginBottom:16 }}>Copy this and send it as a bug report:</p>
        <pre style={{ whiteSpace:"pre-wrap", background:"#fff", border:"1px solid #fecdd3", borderRadius:8, padding:16, fontSize:13, color:"#be123c" }}>{this.state.error}</pre>
        {this.state.info && <pre style={{ whiteSpace:"pre-wrap", fontSize:11, color:"#aaa", marginTop:8 }}>{this.state.info}</pre>}
        <button onClick={() => this.setState({ error: null })} style={{ marginTop:16, padding:"8px 16px", background:"#e11d48", color:"#fff", border:"none", borderRadius:8, cursor:"pointer" }}>Try again</button>
      </div>
    );
    return this.props.children;
  }
}

function App() {
  const [activeTab, setActiveTab] = useState("planner");
  const [activeDay, setActiveDay] = useState("Monday");
  const [weekOffset, setWeekOffset] = useState(0);
  const [pendingDelete, setPendingDelete] = useState(null);
  const [globalCmd, setGlobalCmd] = useState("");
  const [dateRange, setDateRange] = useState({ start: "", end: "" });
  const [showDatePicker, setShowDatePicker] = useState(false);

  // Compute active days from date range
  const activeDays = React.useMemo(() => {
    if (!dateRange.start || !dateRange.end) return null;
    const start = new Date(dateRange.start);
    const end = new Date(dateRange.end);
    if (isNaN(start) || isNaN(end) || end < start) return null;
    const days = [];
    const cur = new Date(start);
    while (cur <= end && days.length < 30) {
      // Use ISO date string as key so each date is unique across weeks
      const iso = cur.toISOString().slice(0, 10); // "2026-03-16"
      days.push(iso);
      cur.setDate(cur.getDate() + 1);
    }
    return days;
  }, [dateRange]);
  const [globalLoading, setGlobalLoading] = useState(false);
  const [globalResult, setGlobalResult] = useState("");

  useEffect(() => {
    if (!pendingDelete) return;
    function handleClick() { setPendingDelete(null); }
    document.addEventListener("click", handleClick);
    return () => document.removeEventListener("click", handleClick);
  }, [pendingDelete]);
  const [weekPlan, setWeekPlan] = useState(() =>
    loadState("weekPlan", Object.fromEntries(DAYS.map(d => [d, []])))
  );
  const [pantry, setPantry] = useState(() => loadState("pantry", []));
  const [newPantryItem, setNewPantryItem] = useState({ name:"", qty:"", unit:"" });
  const [shoppingList, setShoppingList] = useState({});
  const [listLoading, setListLoading] = useState(false);
  const [manualItems, setManualItems] = useState(() => loadState("manualItems", []));
  const [manualInput, setManualInput] = useState("");
  useEffect(() => { saveState("manualItems", manualItems); }, [manualItems]);

  function addManualItem() {
    const name = manualInput.trim();
    if (!name) return;
    setManualItems(prev => [...prev, { id: generateId(), name }]);
    setManualInput("");
  }
  function removeManualItem(id) {
    setManualItems(prev => prev.filter(i => i.id !== id));
  }

  const cmdPlaceholder = useRotatingPlaceholder(CMD_PLACEHOLDERS);
  const [showOnboarding, setShowOnboarding] = useState(() => !loadState("onboardingDone", false));
  const [showDataBanner, setShowDataBanner] = useState(() => !loadState("dataBannerDismissed", false));
  const [onboardingStep, setOnboardingStep] = useState(0);
  const [showBugReport, setShowBugReport] = useState(false);
  const [bugText, setBugText] = useState("");
  const [checkedItems, setCheckedItems] = useState(() => loadState("checkedItems", {}));
  useEffect(() => { saveState("checkedItems", checkedItems); }, [checkedItems]);

  function toggleShoppingItem(cat, name) {
    const key = `${cat}::${name}`;
    setCheckedItems(prev => ({ ...prev, [key]: !prev[key] }));
  }
  function clearChecked() { setCheckedItems({}); setManualItems([]); setShoppingList({}); setActiveTab("planner"); }

  useEffect(() => { saveState("weekPlan", weekPlan); }, [weekPlan]);
  useEffect(() => { saveState("pantry", pantry); }, [pantry]);

  function addMeal(day) {
    setWeekPlan(p => ({
      ...p,
      [day]: [{ id:generateId(), name:"", slot:"Breakfast", servings:"1", ingredients:[], completed:false }, ...(p[day] || [])]
    }));
  }
  function updateMeal(day, id, updated) {
    setWeekPlan(p => ({ ...p, [day]: (p[day] || []).map(m => m.id===id ? updated : m) }));
  }
  const updateMealByIdRef = useRef(null);
  function updateMealById(id, updatedOrFn) {
    setWeekPlan(p => {
      const next = { ...p };
      for (const day of Object.keys(next)) {
        const idx = (next[day] || []).findIndex(m => m.id === id);
        if (idx !== -1) {
          const current = next[day][idx];
          const updated = typeof updatedOrFn === 'function' ? updatedOrFn(current) : updatedOrFn;
          next[day] = [...next[day].slice(0, idx), updated, ...next[day].slice(idx + 1)];
          return next;
        }
      }
      return next;
    });
  }
  // Set ref synchronously so it's always current before any render
  updateMealByIdRef.current = updateMealById;

  function deleteMeal(day, id) {
    setWeekPlan(p => ({ ...p, [day]: (p[day] || []).filter(m => m.id!==id) }));
  }

  async function runGlobalCommand() {
    if (!globalCmd.trim() || globalLoading) return;
    setGlobalLoading(true);
    setGlobalResult("");
    try {
      // Send a lean version of weekPlan
      const leanPlan = {};
      for (const [day, meals] of Object.entries(weekPlan)) {
        leanPlan[day] = meals.map(m => ({ id: m.id, name: m.name, slot: m.slot, servings: m.servings }));
      }
      const raw = await callClaude(
        `You are a meal planning assistant. The user's current week plan (meal names only): ${JSON.stringify(leanPlan)}

Available days: ${(activeDays || DAYS).join(", ")}

User command: "${globalCmd}"

Return ONLY a JSON object with these optional fields:
- "addMeals": [ { "day": "Monday", "name": "Scrambled Eggs", "slot": "Breakfast", "servings": "1" } ]
- "deleteMealNames": [ { "day": "Monday", "name": "Pancakes" } ]
- "markInPantry": ["vanilla extract"]
- "message": "Short confirmation"

Slots: Breakfast, Lunch, Dinner, Snack, Dessert, Beverage.
For commands spanning multiple days and slots, include ALL meals in addMeals — do not truncate.
No markdown, no explanation, just valid JSON.`,
        "You are a helpful meal planning assistant. Return only valid JSON.",
        2000
      );
      const parsed = JSON.parse(raw.replace(/```json|```/g, "").trim());
      // Add new meals and auto-generate ingredients
      if (parsed.addMeals && Array.isArray(parsed.addMeals)) {
        const newMeals = parsed.addMeals.map(m => ({
          id: generateId(),
          name: m.name || "",
          slot: m.slot || "Dinner",
          servings: m.servings || "1",
          ingredients: [],
          completed: false,
          generating: true,
          day: m.day,
        }));

        setWeekPlan(prev => {
          const updated = { ...prev };
          for (const m of newMeals) {
            if (!updated[m.day]) updated[m.day] = [];
            updated[m.day] = [...updated[m.day], m];
          }
          return updated;
        });

        // Auto-generate ingredients for each new meal
        setGlobalResult(`Added ${newMeals.length} meal${newMeals.length > 1 ? "s" : ""}. Generating ingredients…`);
        await new Promise(r => setTimeout(r, 50)); // let React render the generating state first
        for (const m of newMeals) {
          try {
            const ingRaw = await callClaude(
              `List ingredients for "${m.name}" scaled for ${parseFloat(m.servings) || 1} serving(s). Return ONLY a JSON array. Example: [{"name":"egg","qty":"2","unit":"large"}]. Use practical units (g, ml, tbsp, tsp, cup, piece, clove). No markdown.`,
              "You are a recipe assistant. Return only a valid JSON array of ingredients."
            );
            const items = JSON.parse(ingRaw.replace(/```json|```/g, "").trim());
            const newIngs = items.map(i => ({
              id: generateId(),
              name: i.name || "",
              qty: String(i.qty || ""),
              unit: i.unit || "",
              category: guessCategory(i.name || ""),
              emoji: getIngredientEmoji(i.name || ""),
              inPantry: false,
            }));
            setWeekPlan(prev => {
              const updated = { ...prev };
              updated[m.day] = (updated[m.day] || []).map(meal =>
                meal.id === m.id ? { ...meal, ingredients: newIngs, generating: false } : meal
              );
              return updated;
            });
          } catch (e) {
            setWeekPlan(prev => {
              const updated = { ...prev };
              updated[m.day] = (updated[m.day] || []).map(meal =>
                meal.id === m.id ? { ...meal, generating: false } : meal
              );
              return updated;
            });
          }
        }
      }

      // Delete meals by name
      if (parsed.deleteMealNames && Array.isArray(parsed.deleteMealNames)) {
        setWeekPlan(prev => {
          const updated = { ...prev };
          for (const { day, name } of parsed.deleteMealNames) {
            if (updated[day]) {
              updated[day] = updated[day].filter(m => m.name.toLowerCase() !== name.toLowerCase());
            }
          }
          return updated;
        });
      }

      // Mark ingredients as in pantry across all meals
      if (parsed.markInPantry && Array.isArray(parsed.markInPantry)) {
        const names = parsed.markInPantry.map(n => n.toLowerCase().trim());
        setWeekPlan(prev => {
          const updated = { ...prev };
          for (const day of Object.keys(updated)) {
            updated[day] = updated[day].map(meal => ({
              ...meal,
              ingredients: meal.ingredients.map(ing =>
                names.some(n => ing.name.toLowerCase().includes(n) || n.includes(ing.name.toLowerCase()))
                  ? { ...ing, inPantry: true } : ing
              )
            }));
          }
          return updated;
        });
      }

      setGlobalResult(parsed.message || "Done!");
      setGlobalCmd("");
    } catch (err) {
      setGlobalResult("Something went wrong — try rephrasing your command.");
    } finally {
      setGlobalLoading(false);
    }
  }

  // Copy meal to selected days
  function propagateMeal(meal, targetDays) {
    setWeekPlan(prev => {
      const next = { ...prev };
      targetDays.forEach(day => {
        const copy = {
          ...meal,
          id: generateId(),
          ingredients: meal.ingredients.map(i => ({ ...i, id: generateId() }))
        };
        next[day] = [...(next[day] || []), copy];
      });
      return next;
    });
  }

  // Add ingredient directly to pantry from meal card checkbox
  function addIngToPantry(ing) {
    setPantry(prev => {
      if (prev.find(p => p.name.toLowerCase() === ing.name.toLowerCase())) return prev;
      return [...prev, { id: generateId(), name: ing.name, qty: ing.qty || "1", unit: ing.unit || "" }];
    });
  }

  function generateList() {
    setListLoading(true);
    setShoppingList({});

    const totals = {};
    const days = activeDays || DAYS;
    days.forEach(day => {
      (weekPlan[day] || []).forEach(meal => {
        const scale = parseFloat(meal.servings) || 1;
        meal.ingredients.forEach(ing => {
          if (!ing.name.trim()) return;
          const UNIT_MAP = { teaspoon:"tsp", teaspoons:"tsp", tablespoon:"tbsp", tablespoons:"tbsp", cup:"cup", cups:"cup", ounce:"oz", ounces:"oz", pound:"lb", pounds:"lb", gram:"g", grams:"g", kilogram:"kg", kilograms:"kg", milliliter:"ml", milliliters:"ml", liter:"l", liters:"l", piece:"", pieces:"", slice:"", slices:"", clove:"", cloves:"", large:"", medium:"", small:"" };
          const normalizeUnit = u => UNIT_MAP[u.trim().toLowerCase()] ?? u.trim().toLowerCase();
          const normName = ing.name.trim().toLowerCase();
          const normUnit = normalizeUnit(ing.unit);
          const key = normName; // merge by name only
          if (!totals[key]) totals[key] = { name: ing.name.trim(), unit: normUnit, category: ing.category || "Other", qty: 0, inPantry: ing.inPantry || false, unitCounts: {} };
          totals[key].unitCounts[normUnit] = (totals[key].unitCounts[normUnit] || 0) + 1;
          totals[key].qty += (parseFraction(ing.qty) || 1) * scale;
          if (ing.inPantry) totals[key].inPantry = true;
        });
      });
    });

    // Pick most common unit per ingredient
    Object.values(totals).forEach(item => {
      if (item.unitCounts) {
        item.unit = Object.entries(item.unitCounts).sort((a,b) => b[1]-a[1])[0]?.[0] ?? item.unit;
        delete item.unitCounts;
      }
    });

    const listItems = Object.values(totals).filter(i => i.qty > 0);

    const grouped = {};
    listItems.forEach(item => {
      const cat = item.category || "Other";
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(item);
    });

    const sortedGrouped = {};
    Object.keys(grouped).sort((a, b) => a === "Other" ? 1 : b === "Other" ? -1 : a.localeCompare(b)).forEach(cat => {
      sortedGrouped[cat] = grouped[cat].sort((a, b) => a.name.localeCompare(b.name));
    });

    setShoppingList(sortedGrouped);
    setListLoading(false);
    setActiveTab("list");
  }



  function addPantryItem() {
    if (!newPantryItem.name.trim()) return;
    setPantry(p => [...p, { id: generateId(), ...newPantryItem }]);
    setNewPantryItem({ name:"", qty:"", unit:"" });
  }

  const totalMeals = Object.values(weekPlan).reduce((s,meals) => s + (meals?.length||0), 0);

  return (
    <ErrorBoundary><div style={styles.app}>
      <style>{globalStyles}</style>

      {showOnboarding && (
        <OnboardingOverlay
          step={onboardingStep}
          onNext={() => {
            if (onboardingStep < 2) {
              setOnboardingStep(s => s + 1);
            } else {
              saveState("onboardingDone", true);
              setShowOnboarding(false);
            }
          }}
          onSkip={() => { saveState("onboardingDone", true); setShowOnboarding(false); }}
        />
      )}

      <header style={styles.header}>
        <div style={styles.headerInner}>

                  setShowBugReport(false);

          <span style={{ fontSize:16 }}>✦</span>

            value={globalCmd}

            placeholder={`Ask Foodie AI… e.g. "${cmdPlaceholder}"`}

          <button
            onClick={runGlobalCommand}

            style={{ padding:"8px 16px", background:"#7c3aed", border:"none", borderRadius:20, color:"#fff", fontSize:13, fontWeight:600, cursor:"pointer", opacity: (!globalCmd.trim() || globalLoading) ? 0.5 : 1, whiteSpace:"nowrap" }}>

            ✓ {globalResult}

      <nav style={styles.nav}>
        {[["planner","📅 Planner"],["list","🛒 Shopping List"]].map(([id,label]) => (

        <div style={{ background:"#fefce8", borderBottom:"1px solid #fde68a", padding:"8px 24px", display:"flex", alignItems:"center", justifyContent:"space-between", fontSize:12, color:"#92400e" }}>

                    style={{ ...styles.smallBtn, padding:"2px 8px", fontSize:11, background: activeDays ? "#ede9fe" : undefined, color: activeDays ? "#7c3aed" : undefined, borderColor: activeDays ? "#c4b5fd" : undefined }}>

                      style={{ padding:"6px 10px", border:"1.5px solid #c4b5fd", borderRadius:8, fontSize:13, outline:"none", fontFamily:"inherit" }} />
                  </div>
                  <div>
                    <label style={{ fontSize:11, fontWeight:600, color:"#7c3aed", display:"block", marginBottom:4 }}>End Date</label>
                    <input type="date" value={dateRange.end}
                      onChange={e => setDateRange(p => ({ ...p, end: e.target.value }))}
                      style={{ padding:"6px 10px", border:"1.5px solid #c4b5fd", borderRadius:8, fontSize:13, outline:"none", fontFamily:"inherit" }} />
                  </div>
                  <button
                    onClick={() => { if (dateRange.start && dateRange.end) setShowDatePicker(false); }}

                    style={{ ...styles.smallBtn }}>Cancel</button>

                  activeDays.map((dayKey, i) => {

                    const isToday = date.toDateString() === new Date().toDateString();
                    return (
                      <button key={dayKey} onClick={() => setActiveDay(dayKey)}
                        style={{ ...styles.dayBtn, ...(activeDay===dayKey ? styles.dayBtnActive : {}), ...(isToday && activeDay!==dayKey ? { borderColor:"#22863a", borderWidth:2 } : {}) }}>
                        <span style={{ fontSize:11, opacity:.7 }}>{date.toLocaleDateString("en-US",{weekday:"short"})}</span>
                        <span style={styles.dayCount}>{weekPlan[dayKey]?.length||0}</span>
                        <span style={{ fontSize:10, opacity:.65 }}>{date.getMonth()+1}/{date.getDate()}</span>
                      </button>

                      </button>

                      : getWeekDates(weekOffset)[DAYS.indexOf(activeDay)]?.toLocaleDateString("en-US", { month:"long", day:"numeric" })
                    } · {weekPlan[activeDay]?.length||0} meal{weekPlan[activeDay]?.length!==1?"s":""} planned
                  </p>
                </div>

                      <svg width="10" height="10" viewBox="0 0 15 15" fill="none"><path d="M3 3l9 9M12 3l-9 9" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>

              const hasMeals = Object.values(weekPlan).some(meals => meals?.length > 0);

                  <p style={{ fontWeight:700, fontSize:17, margin:"0 0 6px" }}>Ready to build your list?</p>

                    return (
                      <div key={item.id} style={{ ...styles.listItem, opacity: checked ? 0.45 : 1, transition:"opacity 0.25s" }}>

                            onClick={() => toggleShoppingItem("manual", item.id)}>

                              <path d="M2.5 7L5.5 10L11.5 4" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>

                        <button onClick={() => removeManualItem(item.id)} style={styles.iconBtn}>✕</button>

                <h3 style={styles.catHeader}>{cat}</h3>
                {items.map((item, i) => {
                  const itemKey = `${cat}::${item.name}`;
                  const checked = !!checkedItems[itemKey];
                  const inPantry = item.inPantry;
                  return (
                  <div key={i} style={{ ...styles.listItem, opacity: checked ? 0.45 : inPantry ? 0.6 : 1, transition:"opacity 0.25s", background: inPantry ? "#f0fdf4" : styles.listItem.background, border: inPantry ? "1px solid #bbf7d0" : styles.listItem.border }}>
                    <div style={{ display:"flex", alignItems:"center", gap:10, flex:1, minWidth:0 }}>
                      <div className={`check-circle${checked || inPantry ? " checked" : ""}`}
                        onClick={() => !inPantry && toggleShoppingItem(cat, item.name)}
                        style={{ cursor: inPantry ? "default" : "pointer", background: inPantry ? "#22c55e" : undefined, borderColor: inPantry ? "#22c55e" : undefined }}>
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                          <path d="M2.5 7L5.5 10L11.5 4" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
                        </svg>
                      </div>
                      <span style={{ display:"flex", alignItems:"center", gap:7, fontWeight:500, textDecoration: checked || inPantry ? "line-through" : "none", color: checked || inPantry ? "#aaa" : "inherit" }}>

                        {item.name}
                        {inPantry && <span style={{ fontSize:10, fontWeight:700, color:"#16a34a", background:"#dcfce7", border:"1px solid #bbf7d0", borderRadius:6, padding:"1px 5px", marginLeft:4 }}>🧺 in pantry</span>}

                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                      <span style={{ ...styles.listQty, color: checked ? "#bbb" : undefined }}>{(() => { const n = parseFloat(item.qty); return isNaN(n) ? item.qty : (n % 1 === 0 ? n : n.toFixed(1)); })()} {item.unit}</span>
                      {item.fromPantry && <span style={styles.pantryBadge}>in pantry</span>}
                      {item.partial && <span style={styles.pantryBadge}>partial pantry</span>}
                    </div>
                  </div>
                  );
                })}
              </div>

            {/* ── Pantry Section ── */}

                  style={{ ...styles.inputSm, flex:1 }} />
                <button onClick={addPantryItem} style={styles.primaryBtn}>Add</button>
              </div>
              {pantry.length === 0 ? (
                <p style={{ color:"#bbb", fontSize:13, textAlign:"center", padding:"12px 0" }}>No pantry items yet. Check 🧺 on any ingredient in the planner to add it here.</p>
              ) : (
                <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
                  {pantry.map(item => (
                    <div key={item.id} style={{ display:"flex", alignItems:"center", gap:6, background:"#f0fdf4", border:"1px solid #bbf7d0", borderRadius:20, padding:"4px 10px 4px 12px" }}>
                      <span style={{ fontSize:13, fontWeight:500, color:"#166534" }}>{item.name}</span>
                      <button onClick={() => setPantry(p => p.filter(i => i.id !== item.id))}
                        style={{ background:"none", border:"none", cursor:"pointer", color:"#aaa", fontSize:14, lineHeight:1, padding:"0 0 0 2px" }}>✕</button>
                    </div>
                  ))}
                </div>
              )}
            </div>


          </div>
        )}
      </main>
    </div></ErrorBoundary>
  );
}
